<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智慧膳系统 · 嘉宾扫码体验</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% 0%, #16305A 0%, #0B1B33 55%, #071120 100%);
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 4vh 4vw;
  }
  .layout { display: flex; align-items: center; gap: 5vw; max-width: 1500px; width: 100%; }
  .left { flex: 1 1 auto; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 3vh; }
  .logo { width: 54px; height: 54px; border-radius: 15px; background: #07C160; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex: 0 0 auto; }
  h1 { font-size: 4vh; margin: 0 0 6px; font-weight: 600; letter-spacing: .5px; }
  .sub { font-size: 1.9vh; color: #9FB8D4; line-height: 1.6; }
  .url-box { margin: 3vh 0; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 2.2vh 2.4vw; }
  .url-label { font-size: 1.5vh; color: #8AA8CC; margin-bottom: 8px; letter-spacing: 1px; }
  .url { font-size: 3.2vh; font-weight: 600; color: #4FD8B0; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .steps { display: flex; gap: 2vw; margin-top: 3vh; }
  .step { flex: 1; background: rgba(255,255,255,.06); border-radius: 14px; padding: 1.8vh 1.2vw; }
  .step b { display: block; font-size: 1.5vh; color: #4FD8B0; margin-bottom: 6px; }
  .step span { font-size: 1.7vh; color: #D6E4F2; line-height: 1.55; }
  .meta { margin-top: 3vh; font-size: 1.5vh; color: #7C97B6; line-height: 1.7; }
  .tag { display: inline-block; font-size: 1.4vh; border: 1px solid rgba(79,216,176,.45); color: #4FD8B0; border-radius: 999px; padding: 3px 12px; margin-right: 8px; }
  .right { flex: 0 0 auto; text-align: center; }
  .qr-card { background: #fff; border-radius: 26px; padding: 2.2vh 2.2vh 1.6vh; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .qr-card img { width: min(42vh, 42vw); height: auto; display: block; image-rendering: pixelated; }
  .qr-cap { color: #0B1B33; font-size: 1.8vh; font-weight: 600; margin-top: 1.2vh; }
  .qr-cap small { display: block; font-weight: 400; color: #5C7089; font-size: 1.4vh; margin-top: 3px; }
  .refresh { margin-top: 2vh; font-size: 1.4vh; color: #8AA8CC; }
</style>
</head>
<body>
<div class="layout">
  <div class="left">
    <div class="brand">
      <div class="logo">膳</div>
      <div>
        <h1>智慧膳系统 · 扫码体验</h1>
        <div class="sub">高校食堂营养分析与 AI 推荐系统<br/>用手机扫右侧二维码，即可体验学生端功能</div>
      </div>
    </div>

    <div class="url-box">
      <div class="url-label">体验地址</div>
      <div class="url" id="url">加载中…</div>
    </div>

    <div class="steps">
      <div class="step"><b>① 扫码</b><span>手机相机 或 微信「扫一扫」</span></div>
      <div class="step"><b>② 选身份</b><span>挑一位学生（含清真/素食/过敏等不同场景）</span></div>
      <div class="step"><b>③ 看分析</b><span>本周饮食健康评分 + 逐餐点评 + 改进建议</span></div>
      <div class="step"><b>④ 问 AI</b><span>可追问，也能拍照识别一餐</span></div>
    </div>

    <div class="meta">
      <span class="tag" id="mode">—</span>
      <span id="host">—</span>
      <div style="margin-top:8px">若二维码未自动更新，刷新本页即可重新生成（地址变化时会自动刷新）。</div>
    </div>
  </div>

  <div class="right">
    <div class="qr-card">
      <img id="qr" alt="体验页二维码" src="/api/demo/qr.png?size=720" />
      <div class="qr-cap">扫码打开体验版
        <small id="cap">—</small>
      </div>
    </div>
    <div class="refresh" id="refresh">正在加载配置…</div>
  </div>
</div>

<script>
(function () {
  var lastUrl = '';
  function el(id) { return document.getElementById(id); }

  function load() {
    fetch('/api/demo/config').then(function (r) { return r.json(); }).then(function (c) {
      el('url').textContent = c.demoUrl;
      el('mode').textContent = '运行环境：' + c.modeLabel;
      el('host').textContent = c.mode === 'cloud' ? '公网可访问，嘉宾任意网络均可扫码' : '局域网演示，嘉宾需连同一个 WiFi';
      el('cap').textContent = c.mode === 'cloud' ? '任意网络均可' : '需同一 WiFi';
      if (c.demoUrl !== lastUrl) {
        lastUrl = c.demoUrl;
        el('qr').src = '/api/demo/qr.png?size=720&t=' + Date.now();   // 地址变化才重刷图片
      }
      el('refresh').textContent = '已同步地址 · ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }).catch(function () {
      el('url').textContent = '无法读取配置，请确认后端服务已启动';
      el('refresh').textContent = '同步失败';
    });
  }

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
